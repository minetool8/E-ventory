plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.gridinv'
base { archivesName = 'gridinventory-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { gridinventory { source sourceSets.main } }
        }
    }
}

repositories {
    // local jars: libs/<name>-<version>.jar
    flatDir { dir 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // Compile against the real mods (deobfuscated to Mojang names).
    implementation fg.deobf('local:curios:5.14.1')
    implementation fg.deobf('local:backpacked:3.0.9')
    // Backpacked needs MrCrayfish's Framework to compile and run.
    // Put it in libs/ as framework-0.8.0.jar (any 1.20.1 build >= 0.8.0).
    implementation fg.deobf('local:framework:0.8.0')
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', version
    filesMatching('META-INF/mods.toml') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
